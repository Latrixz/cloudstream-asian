name = "csasian-support"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
GOAL_USD = "100"
TELEGRAM_CHAT = "@csasian"
WELCOME_ENABLED = "true"   # bot greets each new member in the @csasian group
WELCOME_REPLACE = "false"   # "true" deletes the previous welcome when a new one is posted
TELEGRAM_GUIDE_MESSAGE_ID = "7"   # the pinned guide post in TELEGRAM_CHAT, linked from the welcome

[[kv_namespaces]]
binding = "SUPPORT"
id = "5462dcbd5bbc451ca1b81501d4a6938c"
