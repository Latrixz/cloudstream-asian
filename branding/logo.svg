<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="85%">
      <stop offset="0" stop-color="#3a2a8c"/>
      <stop offset="0.55" stop-color="#1d1650"/>
      <stop offset="1" stop-color="#0c0a24"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a4e"/>
      <stop offset="1" stop-color="#d81e3c"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3dcff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#05030f" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(-80,70)">
  <!-- rising sun -->
  <circle cx="592" cy="430" r="250" fill="url(#sun)" filter="url(#glow)"/>
  <!-- horizon lines, only inside the sun -->
  <clipPath id="sunclip"><circle cx="592" cy="430" r="250"/></clipPath>
  <g fill="#120e33" clip-path="url(#sunclip)">
    <rect x="300" y="590" width="600" height="26" rx="13"/>
    <rect x="330" y="640" width="540" height="20" rx="10"/>
    <rect x="370" y="682" width="460" height="14" rx="7"/>
  </g>
  <!-- play button -->
  <path d="M352 296 Q352 262 383 278 L668 444 Q698 462 668 480 L383 646 Q352 662 352 628 Z"
        fill="url(#play)" filter="url(#shadow)"/>
  </g>
</svg>
