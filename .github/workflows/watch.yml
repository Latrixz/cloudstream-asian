name: Source watcher
# Runs each source's real code (home page -> title -> links -> stream) and reports which sources play.
# Results go to the job summary and the "watch" branch (status table + uptime history), and a Telegram
# message to the repo variable TELEGRAM_WATCH_CHAT.
#
# The daily check runs on the owner's Mac (scripts/watch-local.sh): GitHub's US servers get blocked by
# several sites and reported ~8 false failures a day. The Mac pushes its results to the "watch" branch,
# then starts this workflow with notify=true so the message goes out with the bot token kept here.
# Running it by hand with no options still does a full check from GitHub.
on:
  workflow_dispatch:
    inputs:
      ping:
        description: "Only send a test message to TELEGRAM_WATCH_CHAT (no source check)"
        type: boolean
        default: false
      notify:
        description: "Only send the latest report from the watch branch (used by the Mac run)"
        type: boolean
        default: false

concurrency:
  group: "watch"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ping:
    if: ${{ inputs.ping }}
    runs-on: ubuntu-latest
    steps:
      - name: Send a test message
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ vars.TELEGRAM_WATCH_CHAT }}
        run: |
          # Which bot the TELEGRAM_BOT_TOKEN secret belongs to (to rule out a token for a different bot).
          curl -s "https://api.telegram.org/bot${TOKEN}/getMe" | python3 -c "import json,sys;r=json.load(sys.stdin).get('result',{});print('bot: @'+str(r.get('username')))"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" --data-urlencode "text=🩺 Source watcher is connected. Daily reports will arrive here." \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print('ok:',d.get('ok'),d.get('description',''));sys.exit(0 if d.get('ok') else 1)"

  notify:
    if: ${{ inputs.notify }}
    runs-on: ubuntu-latest
    steps:
      - name: Send the latest report
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ vars.TELEGRAM_WATCH_CHAT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read through the API, not raw.githubusercontent.com (its CDN can still serve yesterday's copy).
          gh api "repos/${{ github.repository }}/contents/telegram.txt?ref=watch" --jq .content | base64 -d > message.txt
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" --data-urlencode "text@message.txt" --data-urlencode "disable_web_page_preview=true" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print('ok:',d.get('ok'),d.get('description',''));sys.exit(0 if d.get('ok') else 1)"

  watch:
    if: ${{ !inputs.ping && !inputs.notify }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout status history
        run: |
          git clone --depth 1 --branch watch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state \
            || { git init -b watch state && git -C state remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check every source
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew watch --parallel --continue -q || true

      - name: Re-check the ones that failed (sites are often just flaky)
        working-directory: src
        run: |
          sleep 60
          tasks=$(python3 -c "import json,glob;print(' '.join(':'+d['module']+':testReleaseUnitTest' for d in map(lambda p: json.load(open(p)), glob.glob('build/watch/*.json')) if d['status'] not in ('playable','unverified')))")
          echo "Re-checking: $tasks"
          [ -z "$tasks" ] || ./gradlew $tasks --parallel --continue -q || true

      - name: Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WATCH_CHAT: ${{ vars.TELEGRAM_WATCH_CHAT }}
          REPORT_URL: https://github.com/${{ github.repository }}/blob/watch/README.md
        run: python3 src/scripts/watch-report.py src/build/watch state >> "$GITHUB_STEP_SUMMARY"

      - name: Save status history
        working-directory: state
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "Source check $(date -u +%F)" || exit 0
          git push origin watch

      - name: Keep raw results
        uses: actions/upload-artifact@v4
        with:
          name: watch-results
          path: src/build/watch/
          retention-days: 14
