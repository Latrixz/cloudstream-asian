name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - code
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "main"
          path: "builds"
      
      - name: Keep the previous plugin list (for the Telegram announcement)
        run: cp $GITHUB_WORKSPACE/builds/plugins.json $RUNNER_TEMP/old-plugins.json || echo "[]" > $RUNNER_TEMP/old-plugins.json

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp sources/*/build/*.cs3 $GITHUB_WORKSPACE/builds
          # The gradle plugin links to a "builds" branch; this repo publishes to "main".
          sed 's#/builds/#/main/#g' build/plugins.json > $GITHUB_WORKSPACE/builds/plugins.json
          cp repo.json $GITHUB_WORKSPACE/builds

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push --force

      - name: Announce source changes on Telegram
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: "@csasian"
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SCREENSHOTS_DIR: ${{ github.workspace }}/src/screenshots
        run: python3 $GITHUB_WORKSPACE/src/scripts/telegram-notify.py $RUNNER_TEMP/old-plugins.json $GITHUB_WORKSPACE/builds/plugins.json

      - name: Keep the pinned Telegram guide up to date
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: "@csasian"
          TELEGRAM_GUIDE_MESSAGE_ID: ${{ vars.TELEGRAM_GUIDE_MESSAGE_ID }}
        run: python3 $GITHUB_WORKSPACE/src/scripts/telegram-guide.py edit $GITHUB_WORKSPACE/builds/plugins.json
